# PATAS · Plataforma de Acogida Temporal y Adopción Segura
# Un solo contenedor con PostgreSQL + API + aplicación web.
#
#   1) cp .env.example .env        y completa los valores (ver DESPLIEGUE.md)
#   2) docker compose up -d --build
#   3) abre http://localhost:8080  (en producción, detrás de HTTPS)
name: patas

services:
  patas:
    build: .
    image: patas:1.4
    restart: unless-stopped
    ports:
      - "${PUERTO_WEB:-8080}:8080"
    env_file:
      - .env                       # todas las claves y secretos viven SOLO en este archivo
    environment:
      # la contraseña de la base de datos es obligatoria
      PGPASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en el archivo .env}
    volumes:
      - datos:/data                # base de datos, fotos subidas y secreto de sesión
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 30s

volumes:
  datos:
